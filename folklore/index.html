<section id="services" class="wrap sec g">
<p class="s3" style="margin:0;color:#6B6B66;font-size:13px">what we do</p>
<div class="s9">
<h2 style="font-family:'Inter Tight',sans-serif;font-weight:300;font-size:clamp(36px,9vw,72px);line-height:.95;letter-spacing:-.04em;margin:0 0 32px">Build the brand. Then make it heard.</h2><div class="g2 cores" style="gap:40px 24px"><div id="brand-building" style="border-top:1px solid #111;padding-top:16px"><img src="illus/stonecarver.png" alt="A stonecarver chiselling a block" width="640" height="640" loading="lazy" style="display:block;width:min(240px,62%);height:auto;mix-blend-mode:multiply"><h3 style="font-family:'Inter Tight',sans-serif;font-weight:300;font-size:clamp(26px,6vw,36px);letter-spacing:-.02em;line-height:1.05;margin:16px 0 8px">Brand building</h3><p style="margin:0;font-size:16px;line-height:1.5;color:#333;max-width:44ch">New brands built from the ground up. Existing brands made stronger: a firmer identity, a wider circle, and a sharper picture in people's heads.</p><p style="margin:14px 0 0"><span style="display:inline-block;font-size:13px;border:1px solid #CBCBC6;border-radius:14px;padding:3px 10px;margin:0 6px 6px 0">identity</span><span style="display:inline-block;font-size:13px;border:1px solid #CBCBC6;border-radius:14px;padding:3px 10px;margin:0 6px 6px 0">rebrands</span><span style="display:inline-block;font-size:13px;border:1px solid #CBCBC6;border-radius:14px;padding:3px 10px;margin:0 6px 6px 0">brand strategy</span><span style="display:inline-block;font-size:13px;border:1px solid #CBCBC6;border-radius:14px;padding:3px 10px;margin:0 6px 6px 0">naming</span></p></div><div id="creation" style="border-top:1px solid #111;padding-top:16px"><img src="illus/herald.png" alt="A herald blowing a long horn" width="640" height="640" loading="lazy" style="display:block;width:min(240px,62%);height:auto;mix-blend-mode:multiply"><h3 style="font-family:'Inter Tight',sans-serif;font-weight:300;font-size:clamp(26px,6vw,36px);letter-spacing:-.02em;line-height:1.05;margin:16px 0 8px">Creation and communication</h3><p style="margin:0;font-size:16px;line-height:1.5;color:#333;max-width:44ch">Content in any form, from websites to TVCs to social, made to sell and to signal the right values.</p><p style="margin:14px 0 0"><span style="display:inline-block;font-size:13px;border:1px solid #CBCBC6;border-radius:14px;padding:3px 10px;margin:0 6px 6px 0">websites</span><span style="display:inline-block;font-size:13px;border:1px solid #CBCBC6;border-radius:14px;padding:3px 10px;margin:0 6px 6px 0">films and TVCs</span><span style="display:inline-block;font-size:13px;border:1px solid #CBCBC6;border-radius:14px;padding:3px 10px;margin:0 6px 6px 0">social</span><span style="display:inline-block;font-size:13px;border:1px solid #CBCBC6;border-radius:14px;padding:3px 10px;margin:0 6px 6px 0">shoots</span><span style="display:inline-block;font-size:13px;border:1px solid #CBCBC6;border-radius:14px;padding:3px 10px;margin:0 6px 6px 0">events</span></p></div></div>

</div>
</section>

<section id="why" class="wrap g" style="padding-bottom:96px">
<p class="s3" style="margin:0;color:#6B6B66;font-size:13px">why folklore</p>
<div class="s9"><img src="illus/brick-course.png" alt="A course of black bricks with one red brick" width="640" height="183" loading="lazy" style="display:block;width:min(320px,80%);height:auto;mix-blend-mode:multiply;margin:0 0 20px"><h2 style="font-family:'Inter Tight',sans-serif;font-weight:300;font-size:clamp(36px,9vw,72px);line-height:.95;letter-spacing:-.04em;margin:0 0 32px">Small on purpose.</h2><div class="g2 why" style="gap:32px 24px"><div style="border-top:1px solid #111;padding-top:16px;display:grid;grid-template-columns:88px minmax(0,1fr);gap:16px;align-items:start"><img src="illus/pillar.png" alt="A stone pillar" width="320" height="320" loading="lazy" style="display:block;width:88px;height:auto;mix-blend-mode:multiply"><div><h3 style="font-family:'Inter Tight',sans-serif;font-weight:300;font-size:clamp(22px,5.6vw,28px);letter-spacing:-.02em;margin:0 0 6px">No agency overheads.</h3><p style="margin:0;font-size:15px;line-height:1.5;color:#4A4A46">No account managers, no layers. Your fee goes into the work, not the office.</p></div></div><div style="border-top:1px solid #111;padding-top:16px;display:grid;grid-template-columns:88px minmax(0,1fr);gap:16px;align-items:start"><img src="illus/wizard-visualiser.png" alt="A wizard holding up a portrait" width="320" height="320" loading="lazy" style="display:block;width:88px;height:auto;mix-blend-mode:multiply"><div><h3 style="font-family:'Inter Tight',sans-serif;font-weight:300;font-size:clamp(22px,5.6vw,28px);letter-spacing:-.02em;margin:0 0 6px">Made for fashion-led brands.</h3><p style="margin:0;font-size:15px;line-height:1.5;color:#4A4A46">And the founders behind them. Folklore draws out what makes you you, so the brand sounds like itself. Data informs; taste decides.</p></div></div><div style="border-top:1px solid #111;padding-top:16px;display:grid;grid-template-columns:88px minmax(0,1fr);gap:16px;align-items:start"><img src="illus/cannon.png" alt="A cannon firing a ribbon" width="320" height="320" loading="lazy" style="display:block;width:88px;height:auto;mix-blend-mode:multiply"><div><h3 style="font-family:'Inter Tight',sans-serif;font-weight:300;font-size:clamp(22px,5.6vw,28px);letter-spacing:-.02em;margin:0 0 6px">Fast, because it's small.</h3><p style="margin:0;font-size:15px;line-height:1.5;color:#4A4A46">You talk to the people making the work. Fewer handoffs, faster roll-outs.</p></div></div><div style="border-top:1px solid #111;padding-top:16px;display:grid;grid-template-columns:88px minmax(0,1fr);gap:16px;align-items:start"><img src="illus/listening.png" alt="A man cupping his ear to listen" width="320" height="320" loading="lazy" style="display:block;width:88px;height:auto;mix-blend-mode:multiply"><div><h3 style="font-family:'Inter Tight',sans-serif;font-weight:300;font-size:clamp(22px,5.6vw,28px);letter-spacing:-.02em;margin:0 0 6px">Your full attention.</h3><p style="margin:0;font-size:15px;line-height:1.5;color:#4A4A46">One lead from brief to release, and only a few projects at a time.</p></div></div></div></div>
</section>

<section id="production-detail" class="wrap g" style="padding-bottom:96px">
<p class="s3" style="margin:0;color:#6B6B66;font-size:13px">how it runs</p>
<div class="s9">
<h2 style="font-family:'Inter Tight',sans-serif;font-weight:300;font-size:clamp(36px,9vw,72px);line-height:.95;letter-spacing:-.04em;margin:0 0 12px">First sketch to final cut.</h2>
<p style="margin:0;max-width:560px">It starts with a 20-minute call and one thing worth saying. Then five workstreams run at once and meet in one proof before anything goes out. One crew, matched to the brief. At release, you get the keys.</p>

<p style="margin:0 0 24px;color:#C9C9C4">Turn a knob to pick a subject: creative, trust, search or production. Each turn reveals a real number from this year's research.</p>
<div class="panel" style="background:#1E1E1C;border:1px solid #2E2E2B;border-radius:14px;padding:22px;min-height:230px;margin-bottom:12px">

<button type="button" class="cell" onClick="{{k.turnIt}}" aria-label="Turn the {{k.name}} knob" style="background:#111;color:#F4F4F2;padding:24px 8px;text-align:center;border:0"><span style="display:block;width:88px;height:88px;margin:14px auto 12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2A2A27,#141413);border:1px solid #4A4A46;box-shadow:0 6px 0 #000;position:relative"><sc-for list="{{k.ticks}}" as="d" hint-placeholder-count="3"><span style="position:absolute;left:41px;top:41px;width:6px;height:6px;border-radius:50%;background:{{d.c}};transform:rotate({{d.a}}deg) translateY(-52px)"></span></sc-for><span class="knob" style="position:absolute;inset:0;display:block;transform:{{k.turn}}"><span style="position:absolute;left:43px;top:8px;width:2px;height:26px;background:#E8371B;display:block"></span></span></span><span style="display:block;color:#A3A39D;font-size:13px">fact {{k.pos}}</span><span style="display:block">{{k.name}}</span></button>
</sc-for>

<p style="margin:14px 0 0;font-size:13px;color:#A3A39D">The dots show how many facts each knob holds. Every number is sourced and dated.</p>

<div class="s5">
<div class="panel" style="border:1px solid #2E2E2B;border-radius:14px;padding:22px;display:grid;gap:14px">

<p style="margin:0;font-family:'Inter Tight',sans-serif;font-size:19px;color:#F4F4F2">Every brand needs a creative technologist now. This is where to find one.</p>
<p style="margin:0;color:#C9C9C4">A newsletter where creative technologists show their work and share what they know, and brands find the ones to hire. Every issue tests new AI tools on real brand work, so you only hear about the ones worth your time.</p>

<p style="margin:0">Drag it to see what changes. AI makes work faster and cheaper. What keeps it original is the idea behind it, and what keeps it trusted is being upfront: 73% of consumers trust an ad less when they suspect AI made it (The Harris Poll, 2026).</p>

<p style="margin:14px 0 0;font-size:13px;color:#6B6B66">* Uniqueness depends on the idea: a great creative makes AI work harder. Trust holds better when you say it's AI-made, though hand-made still leads.</p>

<p class="s3" style="margin:0;color:#6B6B66;font-size:13px">faq</p>
<div class="s9" style="border-top:1px solid #111">
<details style="border-bottom:1px solid #CBCBC6;padding:22px 0"><summary style="font-family:'Inter Tight',sans-serif;font-weight:300;font-size:clamp(22px,6vw,32px);letter-spacing:-.02em">What does it cost?</summary><p style="margin:12px 0 0">From a single retouched image to a full brand launch. Identities start from S$3,000 for the first three founding clients, and from S$5,500 after that. Every quote is scoped to the brief and agreed before anything starts.</p></details>
<details style="border-bottom:1px solid #CBCBC6;padding:22px 0"><summary style="font-family:'Inter Tight',sans-serif;font-weight:300;font-size:clamp(22px,6vw,32px);letter-spacing:-.02em">How long does it take?</summary><p style="margin:12px 0 0">Small jobs like retouching or a refresh: days to two weeks. Shoots and campaigns: about 2 to 6 weeks. A full identity: about 6 to 10 weeks. Exact dates are set on the first call.</p></details>
<details style="border-bottom:1px solid #CBCBC6;padding:22px 0"><summary style="font-family:'Inter Tight',sans-serif;font-weight:300;font-size:clamp(22px,6vw,32px);letter-spacing:-.02em">Where do you use AI?</summary><p style="margin:12px 0 0">It depends on the brief. Folklore decides with you, based on the timeline, scope and budget, and every proposal says where AI is used. Logos are still drawn by hand.</p></details>
<details style="border-bottom:1px solid #CBCBC6;padding:22px 0"><summary style="font-family:'Inter Tight',sans-serif;font-weight:300;font-size:clamp(22px,6vw,32px);letter-spacing:-.02em">Do you do production and events?</summary><p style="margin:12px 0 0">Yes. Shoots, films, motion, launches and pop-ups, with a crew matched to the brief. Quoted per project after a call.</p></details>

<section class="qch" id="tavern">
<p class="cap">Chapter I</p>
<h2 class="h2">The Tavern Board</h2>
<p class="lede">Nothing here is free. You pay in attention, the currency every brand is fighting for.</p>
<div class="board">
<div class="notice {{qv.shake}}">
<p style="margin:0 0 8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span class="tag">Wanted</span><span style="font-size:13px;font-weight:600">Notice #{{qv.ideaNo}} · for {{qv.ideaFor}}</span></p>
<p class="vt" style="margin:0;font-size:25px;line-height:1.15">{{qv.idea}}</p>
<p style="margin:12px 0 0;font-size:15px;font-style:italic;color:#6a4a22">{{qv.ideaFooter}}</p>
</div>
</div>
<div style="margin-top:12px"><button type="button" class="btn" onClick="{{qv.nextIdea}}">Pull another notice <span style="font-size:14px;color:#2d6a1e">+10 XP</span></button></div>
</section>

<section class="qch" id="party">
<p class="cap">Chapter II</p>
<h2 class="h2">Assemble Your Party</h2>
<p class="lede">Two crafts. The builders make the brand; the heralds make it heard. Hire one, or the whole party.</p>
<div class="two" style="display:grid;gap:10px">
<sc-for list="{{qv.party}}" as="m" hint-placeholder-count="4">
<div class="frame"><div class="parch" style="display:flex;gap:14px;align-items:flex-start;padding:12px">
<img class="idle" src="{{m.img}}" alt="" width="64" height="80" style="image-rendering:pixelated;display:block;flex:none;border:3px solid #0a0908;animation-delay:{{m.delay}}s">
<div style="min-width:0">
<p style="margin:0;font-size:20px;font-weight:700;line-height:1.1">{{m.name}}</p>
<p style="margin:4px 0 6px"><span class="tag">{{m.cls}}</span></p>
<p style="margin:0;font-size:16px">{{m.desc}}</p>
</div>
</div></div>
</sc-for>
</div>
</section>

<section class="qch" id="oaths">
<p class="cap">Chapter III</p>
<h2 class="h2">The Party's Oaths</h2>
<p class="lede">Small on purpose. Four oaths, sworn on every quest.</p>
<div class="frame"><div class="two" style="display:grid;gap:10px;padding:6px"><div class="parch" style="padding:12px"><p style="margin:0 0 6px"><span class="tag">No toll</span></p><p style="margin:0;font-size:20px;font-weight:700;line-height:1.1">No middlemen at the gate.</p><p style="margin:6px 0 0;font-size:16px">No account managers, no layers. Your gold goes into the quest, not the castle.</p></div><div class="parch" style="padding:12px"><p style="margin:0 0 6px"><span class="tag">Sworn</span></p><p style="margin:0;font-size:20px;font-weight:700;line-height:1.1">Pledged to fashion-led brands.</p><p style="margin:6px 0 0;font-size:16px">And the founders who lead them. The party draws out your true name. Maps inform; instinct decides.</p></div><div class="parch" style="padding:12px"><p style="margin:0 0 6px"><span class="tag">Swift</span></p><p style="margin:0;font-size:20px;font-weight:700;line-height:1.1">Small party, quick march.</p><p style="margin:6px 0 0;font-size:16px">You ride with the people doing the work. Fewer messengers, faster roll-outs.</p></div><div class="parch" style="padding:12px"><p style="margin:0 0 6px"><span class="tag">Watch</span></p><p style="margin:0;font-size:20px;font-weight:700;line-height:1.1">One lead keeps watch.</p><p style="margin:6px 0 0;font-size:16px">From brief to release, and only a few quests at a time.</p></div></div></div>
</section>

<section class="qch" id="workshop">
<p class="cap">Chapter IV</p>
<h2 class="h2">The Workshop</h2>
<p class="lede">First sketch to final cut.</p>
<div class="frame"><div class="parch">
<p style="margin:0 0 12px;font-size:16px">It starts with a 20-minute call and one thing worth saying. Then five workstreams run at once and meet in one proof before anything goes out. One crew, matched to the brief. At release, you get the keys.</p>
<div class="qmap">
<span class="qnode">brief</span><span class="qarrow">▼</span>
<div class="qlanes"><span>research</span><span>exploration</span><span>strategy</span><span>creative</span><span>production</span></div>
<span class="qarrow">▼</span><span class="qnode ember">proof</span><span class="qarrow">▼</span><span class="qnode">release</span>
</div>
<sc-for list="{{qv.production}}" as="pr" hint-placeholder-count="6"><p style="margin:0;padding:8px 0;border-top:3px dotted #b89a5c"><strong style="font-size:17px">{{pr.t}}</strong><br><span style="font-size:15px">{{pr.x}}</span></p></sc-for>
<p style="margin:12px 0 0;padding:10px 0 0;border-top:3px dotted #b89a5c;font-size:15px"><strong style="display:block;font-size:40px;line-height:1;margin-bottom:6px;color:#8a1414">71%</strong>of consumers say physical experiences deepen their connection to a brand. <span style="font-size:12px">The Harris Poll, Cannes Lions 2026</span></p>
</div></div>
</section>











<section class="qch" id="merchant">
<p class="cap">Chapter V</p>
<h2 class="h2">The Merchant</h2>
<p class="lede">"Fair prices, scoped to your quest."</p>
<div class="qpg-nav"><span>swipe for more →</span><button type="button" class="btn sm stone" aria-label="Previous price card" onClick="{{qv.prevCard}}">◀</button><button type="button" class="btn sm stone" aria-label="Next price card" onClick="{{qv.nextCard}}">▶</button></div>
<div class="qpg" id="qrail">
<sc-for list="{{qv.offerGroups}}" as="gr" hint-placeholder-count="3">
<div class="frame qpgc"><div class="parch" style="padding:12px 16px">
<p style="margin:0;font-size:24px;font-weight:700">{{gr.label}}</p>
<p style="margin:2px 0 6px;font-size:14px;color:#6a4a22">{{gr.line}}</p>
<sc-for list="{{gr.items}}" as="o" hint-placeholder-count="3">
<div class="{{o.cls}}" style="padding:10px 0;border-top:3px dotted #b89a5c">
<p style="margin:0;display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap"><span style="font-size:18px;font-weight:700">{{o.name}}</span><span style="font-size:12px;color:#6a4a22">{{o.gold}}</span></p>
<p style="margin:2px 0 4px;font-size:15px">{{o.desc}}</p>
<p style="margin:0;font-weight:700;font-size:17px;color:#8a1414">{{o.price}}</p>
</div>
</sc-for>
</div></div>
</sc-for>
</div>
<p style="margin:10px 0 0;font-size:15px">From tiny jobs to full launches. Every quote is scoped to your quest.</p>
<div style="margin-top:10px"><a class="btn red" href="#finale">Summon the Dungeon Master (book a call)</a></div>
</section>

<section class="qch" id="dm">
<p class="cap">Chapter VI</p>
<h2 class="h2">The Dungeon Master</h2>
<p class="lede">The studio behind it.</p>
<div class="frame"><div class="parch">
<div style="display:flex;gap:14px;align-items:flex-start">
<img src="{{qv.spr.cage}}" alt="Pixel portrait of the Dungeon Master (placeholder)" width="80" height="96" style="image-rendering:pixelated;display:block;flex:none;background:#26221e;border:3px solid #0a0908">
<div style="font-size:15px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px">
<span style="font-weight:700">Studio</span><span>Folklore</span>
<span style="font-weight:700">Level</span><span>10 years in creative agencies</span>
<span style="font-weight:700">Party</span><span>Core team, specialists, AI agents</span>
<span style="font-weight:700">Alignment</span><span>Chaotic good</span>
<span style="font-weight:700">Base</span><span>Singapore</span>
</div>
</div>
<div class="slate" style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;padding:12px 8px;margin:14px 0 0"><span><strong style="font-size:30px;display:block">1</strong><span style="font-size:12px">senior creative on every quest</span></span><span><strong style="font-size:30px;display:block">0</strong><span style="font-size:12px">account managers</span></span><span><strong style="font-size:30px;display:block;color:#f07a2a">4</strong><span style="font-size:12px">disciplines under one brief</span></span></div>
<p style="margin:14px 0 0;font-size:17px">Built on one belief: the safe idea is what kills brands. Folklore exists to make brands worth retelling, and to help build Singapore's culture capital along the way.</p>
</div></div>
</section>

<section class="qch" id="lab">
<p class="cap">Chapter VII</p>
<h2 class="h2">The Lab</h2>
<p class="lede">Things Folklore builds to think out loud.</p>
<h3 class="h2" style="font-size:26px;margin-top:22px">Consult the Oracle</h3>
<p class="lede">What is AI really doing to marketing? Pick a subject, and the Oracle answers with a real number from this year's research.</p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
<sc-for list="{{qv.topics}}" as="t" hint-placeholder-count="4"><button type="button" class="btn sm {{t.cls}}" aria-pressed="{{t.on}}" onClick="{{t.pick}}">{{t.name}}</button></sc-for>
</div>
<div class="frame"><div class="slate {{qv.factAnim}}" style="text-align:center;padding:20px 16px">
<p style="margin:10px 0 6px;font-size:clamp(56px,18vw,88px);line-height:1;font-weight:700;color:#e8b84a;text-shadow:4px 4px 0 #a81c1c">{{qv.factBig}}</p>
<p style="margin:0;font-size:18px">{{qv.factLine}}</p>
<p style="margin:10px 0 0;font-size:13px;color:#a39a92">Source: {{qv.factSource}}</p>
</div></div>
<div style="margin-top:10px"><button type="button" class="btn" onClick="{{qv.nextFact}}">Ask the Oracle again <span style="font-size:14px;color:#2d6a1e">+5 XP</span></button></div>
<div class="frame" style="margin-top:14px"><div class="parch">
<p style="margin:0 0 2px;font-size:13px">a newsletter by Folklore · coming soon</p>
<p style="margin:4px 0 8px;line-height:0"><img src="assets/familiar-lockup-black.png" alt="Familiar, by Folklore" width="1470" height="500" class="famlogo fk" style="display:block;width:100%;max-width:280px;height:auto"><img src="assets/familiar-lockup-white.png" alt="" width="1470" height="500" class="famlogo fw" style="display:none;width:100%;max-width:280px;height:auto"></p>
<p style="margin:0 0 8px;font-size:17px">Every brand needs a creative technologist now. A familiar is a wizard's helper. This is where to find yours.</p>
<p style="margin:0 0 12px;font-size:15px">A newsletter where creative technologists show their work and share what they know, and brands find the ones to hire. Every issue tests new AI tools on real brand work.</p>
<label for="em" style="display:block;font-size:13px;font-weight:600;margin-bottom:4px">Your email</label>
<div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px"><input id="em" type="email" placeholder="you@brand.com" style="min-height:44px;box-sizing:border-box;border:3px solid #0a0908;background:#fff8e4;font:16px 'Pixelify Sans',sans-serif;padding:0 10px;min-width:0"><button type="button" class="btn sm red" style="width:auto">Subscribe</button></div>
</div></div>
<h3 class="h2" style="font-size:26px;margin-top:22px">The Forge</h3>
<p class="lede">How much magic should go into your brand? Drag the slider. A great idea makes magic work harder, and saying it's AI-made keeps trust.</p>
<div class="frame"><div class="parch">
<p style="margin:0 0 4px;display:flex;justify-content:space-between;font-size:14px;font-weight:600"><span>Hand-forged</span><span style="font-size:18px;font-weight:700;color:#a81c1c">{{qv.ai}}% AI</span><span>Conjured</span></p>
<input type="range" min="0" max="100" step="10" value="{{qv.ai}}" onChange="{{qv.onDial}}" aria-label="Percentage of AI" style="width:100%;height:44px;accent-color:#a81c1c;margin:0 0 8px">
<sc-for list="{{qv.bars}}" as="b" hint-placeholder-count="4">
<div style="display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;align-items:center;margin-top:8px"><span style="font-size:14px;font-weight:700">{{b.label}}</span><span class="seg"><sc-for list="{{b.segs}}" as="g" hint-placeholder-count="10"><span style="background:{{g}}"></span></sc-for></span></div>
</sc-for>
<div style="margin-top:16px;padding:10px 12px;background:#2b1d0e;color:#e9d8a6;border:3px solid #0a0908">
<p style="margin:0;font-size:13px;font-weight:700;letter-spacing:.1em;color:{{qv.verdictColor}}">{{qv.rarity}}</p>
<p style="margin:2px 0 0;font-size:17px">{{qv.verdict}}</p>
</div>
<p style="margin:10px 0 0;font-size:14px">The trust drop is research: 73% of consumers trust an ad less when they suspect AI made it (The Harris Poll). The 30% is Folklore's call. Logos are always by hand.</p>
</div></div>
<h3 class="h2" style="font-size:26px;margin-top:22px">The Secret Door</h3>
<p class="lede">You came in through it. The same studio waits on the other side, plain.</p>
<div style="margin-top:10px"><button type="button" class="btn stone" onClick="{{qv.exit}}">Step back through the door</button></div>
<div style="margin-top:22px;display:flex;gap:14px;align-items:center">
<img class="twitch" src="{{qv.spr.chest}}" alt="" width="80" height="68" style="image-rendering:pixelated;display:block;flex:none">
<div style="flex:1"><p style="margin:0 0 8px;font-size:16px">A chest sits in the corner. It's probably fine.</p><button type="button" class="btn sm stone" onClick="{{qv.die}}">Open the chest</button></div>
</div>
</section>

<section class="qch" id="scrolls">
<p class="cap">Chapter VIII</p>
<h2 class="h2">Scrolls of Wisdom</h2>
<p class="lede">Questions people ask.</p>
<div class="frame"><div class="parch" style="padding:8px 16px">
<details><summary>What does it cost?</summary><p style="margin:0 0 12px;font-size:16px">From a single retouched image to a full brand launch. Identities start from S$3,000 for the first three founding clients, from S$5,500 after.</p></details>
<details><summary>Where do you use AI?</summary><p style="margin:0 0 12px;font-size:16px">It depends on the brief. Folklore decides with you, based on timeline, scope and budget. Logos are still drawn by hand.</p></details>
<details><summary>Who owns the work?</summary><p style="margin:0 0 12px;font-size:16px">You do, once it's paid. Your brand, your keys.</p></details>
<details><summary>How long does it take?</summary><p style="margin:0 0 12px;font-size:16px">Small jobs: days to two weeks. Shoots and campaigns: about 2 to 6 weeks. A full identity: about 6 to 10 weeks.</p></details>
</div></div>
</section>

// 3D d12 geometry (dodecahedron), computed once
const D12 = (() => {
  const p = (1 + Math.sqrt(5)) / 2, q = 1 / p, S = 34;
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k], dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const norm = a => mul(a, 1 / Math.sqrt(dot(a, a)));
  const V = [];
  for (const x of [-1, 1]) for (const y of [-1, 1]) for (const z of [-1, 1]) V.push([x, y, z]);
  for (const a of [-1, 1]) for (const b of [-1, 1]) { V.push([0, a * q, b * p]); V.push([a * q, b * p, 0]); V.push([a * p, 0, b * q]); }
  const C = [];
  for (const a of [-1, 1]) for (const b of [-1, 1]) { C.push([0, a * p, b]); C.push([a * p, b, 0]); C.push([b, 0, a * p]); }
  const NUMS = [1, 7, 4, 12, 6, 9, 10, 3, 8, 5, 11, 2];
  const faces = C.map((c0, fi) => {
    const N = norm(c0);
    const vs = V.map(v => [v, dot(norm(v), N)]).sort((a, b) => b[1] - a[1]).slice(0, 5).map(x => x[0]);
    const cen = mul(vs.reduce(add, [0, 0, 0]), 1 / 5);
    const U = norm(cross([0.3, 1, 0.2], N));
    const W = cross(N, U);
    const loc = vs.map(v => { const d = sub(v, cen); return [dot(d, U) * S, dot(d, W) * S]; });
    loc.sort((a, b) => Math.atan2(a[1], a[0]) - Math.atan2(b[1], b[0]));
    const minx = Math.min(...loc.map(l => l[0])), miny = Math.min(...loc.map(l => l[1]));
    const maxx = Math.max(...loc.map(l => l[0])), maxy = Math.max(...loc.map(l => l[1]));
    const O = add(add(mul(cen, S), mul(U, minx)), mul(W, miny));
    const m = 'matrix3d(' + [U[0], U[1], U[2], 0, W[0], W[1], W[2], 0, N[0], N[1], N[2], 0, O[0], O[1], O[2], 1].map(x => +x.toFixed(4)).join(',') + ')';
    return { U, W, N, m, n: 0, w: (maxx - minx).toFixed(2), h: (maxy - miny).toFixed(2), pts: loc.map(l => (l[0] - minx).toFixed(2) + ',' + (l[1] - miny).toFixed(2)).join(' '), tx: (-minx).toFixed(2), ty: (-miny).toFixed(2) };
  });
  // number faces so opposite faces sum to 13
  let k = 1; faces.forEach(f => { if (f.n) return; f.n = k; const o = faces.find(g => g !== f && dot(g.N, f.N) < -0.99); if (o) o.n = 13 - k; k++; });
  return { faces, dot };
})();

// Generative texture behind the logo in "who's behind it". Runs on its own, outside the component.
(function () {
  if (typeof window === 'undefined' || !window.requestAnimationFrame) return;
  const MODES = ['01 · noise field', '02 · interference', '03 · drift', '04 · signal'];
  let mode = 0, t0 = performance.now(), seed = Math.random() * 1000;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const N = (x, y, t) => Math.sin(x * 1.7 + t * 0.9 + seed) * Math.cos(y * 1.3 - t * 0.7) + Math.sin((x + y) * 0.9 + t * 0.5) * 0.6 + Math.cos(Math.hypot(x - 2, y - 3) * 2.1 - t * 1.1) * 0.5;
  document.addEventListener('click', e => {
    if (e.target.closest && e.target.closest('#genbtn, .gen')) { mode = (mode + 1) % MODES.length; seed = Math.random() * 1000; const l = document.getElementById('genlabel'); if (l) l.textContent = MODES[mode]; }
  });
  function frame(now) {
    const c = document.getElementById('genart');
    if (c && c.offsetWidth) {
      const dpr = Math.min(2, window.devicePixelRatio || 1), W = c.offsetWidth, H = c.offsetHeight;
      if (c.width !== Math.round(W * dpr)) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
      const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
      const t = reduce ? 2 : (now - t0) / 1000;
      const lbl = document.getElementById('genlabel'); if (lbl && lbl.textContent !== MODES[mode]) lbl.textContent = MODES[mode];
      if (mode === 2) { g.fillStyle = 'rgba(10,9,8,0.12)'; g.fillRect(0, 0, W, H); } else { g.fillStyle = '#0A0908'; g.fillRect(0, 0, W, H); }
      const step = 11, cols = Math.ceil(W / step) + 1, rows = Math.ceil(H / step) + 1;
      for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
        const x = i * step, y = j * step, u = i / 6, v = j / 6;
        let a;
        if (mode === 0) a = (N(u, v, t) + 2) / 4;
        else if (mode === 1) { const d1 = Math.hypot(x - W * (0.3 + 0.2 * Math.sin(t * 0.4)), y - H * 0.35), d2 = Math.hypot(x - W * 0.7, y - H * (0.65 + 0.15 * Math.cos(t * 0.5))); a = (Math.sin(d1 * 0.09 - t * 2) + Math.sin(d2 * 0.09 - t * 2.3) + 2) / 4; }
        else if (mode === 2) { if ((i + j * 7 + Math.floor(t * 3)) % 9) continue; const ang = N(u, v, t * 0.4) * Math.PI; const px = x + Math.cos(ang) * 6, py = y + Math.sin(ang) * 6; g.fillStyle = '#F4F4F2'; g.beginPath(); g.arc(px, py, 1.1, 0, 6.283); g.fill(); continue; }
        else { const band = Math.sin(v * 1.6 - t * 3 + Math.sin(u * 0.8 + t) * 1.5); a = band > 0.85 ? 1 : Math.max(0, (N(u * 0.5, v * 0.5, t) + 0.5) / 5); }
        const r = Math.max(0, a * a * (step * 0.48));
        if (r < 0.35) continue;
        const hot = a > 0.93 && ((i * 31 + j * 17) % 23 === 0);
        g.fillStyle = hot ? '#A3A39D' : (a > 0.6 ? '#6B6B66' : '#3A3A36');
        g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fill();
      }
    }
    if (!reduce) requestAnimationFrame(frame); else setTimeout(() => requestAnimationFrame(frame), 1000);
  }
  requestAnimationFrame(frame);
})();
