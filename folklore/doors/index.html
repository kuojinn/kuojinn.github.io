<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Crossroads · Folklore</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@900&family=Inter+Tight:wght@300;400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: Folklore. Short, sure, a little mischievous. Kill the safe idea.
   IDEA: a corridor of doors in an old story; each pick opens the next one.
   PICTURE: Cage's naive ink illustrations, large, one per step.
   COLOUR and TYPE: paper #F4F4F2, ink #0A0908, signal red under 10%. Inter Tight Light, Doto for dots.
   LAYOUT: one calm column; picture, question, doors in a row that wrap on phones. */
:root{color-scheme:light;--bg:#F4F4F2;--ink:#0A0908;--g1:#CBCBC6;--g2:#A3A39D;--g3:#6B6B66;--red:#E8371B}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:300 17px/1.5 "Inter Tight",system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:760px;margin:0 auto;padding:clamp(20px,4vw,48px) max(5vw,16px) 64px;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:clamp(16px,3vw,32px)}
.brand{font-weight:600;font-size:18px;letter-spacing:-.01em}
.dots{display:flex;gap:8px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--g1)}
.dots i.on{background:var(--ink)}.dots i.now{background:var(--red)}
.pic{display:flex;justify-content:center;margin:0 auto 8px;width:min(340px,70vw);aspect-ratio:1}
.pic img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
h1{font-weight:300;font-size:clamp(32px,6vw,48px);line-height:1.05;letter-spacing:-.02em;margin:8px 0 12px;text-align:center;text-wrap:balance}
.lead{color:var(--g3);text-align:center;max-width:52ch;margin:0 auto 28px}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));grid-auto-rows:1fr;gap:12px;margin-top:8px}
.door{appearance:none;font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--ink);border-radius:80px 80px 8px 8px;min-height:150px;padding:24px 20px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;transition:background .2s ease,color .2s ease}
.door:hover{background:var(--ink);color:var(--bg)}
.door:focus-visible{outline:3px solid var(--red);outline-offset:4px}
.door{flex-direction:column;gap:8px}.door span{font-size:17px;line-height:1.3;font-weight:400}.door small{font-size:13px;color:var(--g3)}.door:hover small{color:var(--g1)}.door.open small{color:var(--ink)}
.gets{margin:12px 0 0;padding:0;list-style:none}.gets li{padding:6px 0 6px 20px;position:relative;border-top:1px solid var(--g1)}.gets li::before{content:'';position:absolute;left:2px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--ink)}.gets li:first-child::before{background:var(--red)}
.door.open{background:var(--red);border-color:var(--red);color:var(--ink)}
.btn{appearance:none;font:inherit;font-weight:600;border:2px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:999px;min-height:48px;padding:10px 24px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:24px}
.back{appearance:none;background:none;border:0;font:inherit;color:var(--g3);text-decoration:underline;cursor:pointer;margin-top:20px;align-self:center;min-height:44px}
.card{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:clamp(20px,4vw,32px);margin-top:8px}
.card h2{font-weight:600;font-size:18px;margin:0 0 6px}
.card p{margin:0 0 6px}
.start{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;border-top:1px solid var(--g1);margin-top:16px;padding-top:16px}
.start b{font-weight:600}
.tag{font-size:14px;color:var(--g3)}
.also{text-align:center;color:var(--g3);margin-top:18px;font-size:15px}
.note{margin-top:auto;padding-top:40px;font-size:13px;color:var(--g2);text-align:center}
.stage{animation:in .35s ease both;background:var(--bg)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.stage{animation:none}.door{transition:none}}
.brand img{display:block;height:22px;width:auto}
@media (max-width:600px){.doors{grid-template-columns:1fr}.door{min-height:88px;border-radius:44px 44px 8px 8px}}
</style>
</head>
<body>
<div class="wrap">
  <header><a class="brand" href="../index.html" aria-label="Back to Folklore"><img src="wordmark.svg" alt="Folklore"></a><div class="dots" id="dots" aria-hidden="true"></div></header>
  <main id="app" aria-live="polite"></main>
  <p class="note">Three questions, about a minute. Your answers stay on this page.<br>Illustrations made with AI, art-directed by Folklore.</p>
</div>
<script>
{
const OUT = {
  clarity:{img:'img/wizard-strategist.png',hint:'clarity first',short:'clarity',title:'You need clarity first.',why:'Before anything gets made, Folklore finds the one thing worth saying, so everything after it pulls the same way.',gets:['A one-page brief: who you are for, and why','The one idea worth retelling','A clear next step, sized to your budget'],start:'Direction session',tag:'Two hours, one page of direction.'},
  rebrand:{img:'img/stonecarver.png',hint:'a brand refresh',short:'a brand refresh',title:'You need a brand refresh.',why:'The business has outgrown its look. Folklore keeps what people already love and recarves the rest.',gets:['An honest look at what works and what doesn’t','A sharper mark, type and colour','New rules, so it stays consistent'],start:'Brand refresh, or a full identity',tag:'Scoped to how far it needs to go.'},
  fresh:{img:'img/cow.png',hint:'building the brand, block by block',short:'building the brand',title:'Build the brand, block by block.',why:'One idea worth retelling first. Then the name, the look and the voice, laid down in the right order.',gets:['The idea and the name','A full identity: mark, type, colour, voice','Guidelines and your first pieces'],start:'Founding identity',tag:'Open to the first three clients.'},
  content:{img:'img/herald.png',hint:'more content',short:'more content',title:'You need more content.',why:'The brand works. Now it needs feeding: a steady stream of shoots, films and posts, all made to the same standard.',gets:['A content plan built around one idea','Shoots and films, cut for every channel','Monthly social, if you want it ongoing'],start:'Social content or a photoshoot',tag:'Monthly, or one big push.'},
  launch:{img:'img/cannon.png',hint:'a launch',short:'a launch',title:'You’ve got something to launch.',why:'A new product or collection deserves a moment. Folklore plans the idea, the campaign and the day it goes out.',gets:['The launch idea','A campaign cut for every channel','The event, drop or first week, planned and run'],start:'Small ad campaign, up to a full brand launch',tag:'Sized to the date on your calendar.'},
  production:{img:'img/goblin-printer.png',hint:'a production partner',short:'a production partner',title:'You need a production partner.',why:'The brand and the ideas are in place. You need the crew to make them, produced end to end and on time.',gets:['A crew matched to the brief','The shoot, film, TVC or event, produced end to end','Finals cut for every channel you need'],start:'Photoshoot, or production quoted per job',tag:'From one day to a full campaign.'}
};
const ORDER = ['clarity','rebrand','fresh','content','launch','production'];
const FIRST = {img:'img/warrior.png',q:'How’s the brand doing?',doors:[
  ['Healthy. We just need more from it',{content:1,launch:1,production:1},'healthy','more content, a launch or a production partner'],
  ['It’s not working the way it should',{rebrand:1,clarity:1},'fix','a refresh, or clarity first'],
  ['There isn’t one yet',{fresh:2},'fresh','building the brand, block by block']]};
const PATHS = {
  healthy:[
    {img:'img/night-paster.png',q:'What’s next for you?',doors:[
      ['A new product or collection',{launch:3}],
      ['More content, more often',{content:3}],
      ['A big shoot, film or event',{production:3}],
      ['A new market or audience',{launch:2,content:1}]]},
    {img:'img/wizard-visualiser.png',q:'Who has the ideas?',doors:[
      ['We do. We need the crew to make them',{production:3}],
      ['We need the ideas and the crew',{launch:2,content:1}],
      ['We need a steady stream, every month',{content:3}]]}],
  fix:[
    {img:'img/rumour-goblins.png',q:'What feels off?',doors:[
      ['We look older than the business',{rebrand:3}],
      ['People describe us wrong',{rebrand:2,clarity:1}],
      ['We’re not sure what we stand for',{clarity:3}],
      ['Good brand, but nobody’s seeing it',{content:3}]]},
    {img:'img/wizard-visualiser.png',q:'What do you already have?',doors:[
      ['Pieces made by five different people',{rebrand:2,clarity:1}],
      ['A logo, but nothing built around it',{fresh:2,rebrand:1}],
      ['Plenty of stuff, no direction',{clarity:3}],
      ['A logo and rules that still work',{content:2}]]}],
  fresh:[
    {img:'img/listening.png',q:'Where are you?',doors:[
      ['Just an idea for now',{clarity:2,fresh:1}],
      ['Opening soon, nothing built',{fresh:3}],
      ['Opening on a set date',{fresh:2,launch:2}]]},
    {img:'img/night-paster.png',q:'What matters most first?',doors:[
      ['Knowing what we stand for',{clarity:3}],
      ['A name and a look people remember',{fresh:3}],
      ['Getting noticed on day one',{launch:2,fresh:1}]]}]
};
const lead = w => { let k = ORDER[0], v = -1; for (const x of ORDER) if ((w[x] || 0) > v) { v = w[x] || 0; k = x; } return OUT[k].hint; };
const app = document.getElementById('app'), dots = document.getElementById('dots');
let step = -1, picks = [], seq = [FIRST];
const TOTAL = 3;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const drawDots = () => { dots.innerHTML = Array.from({length: TOTAL}, (_, i) => `<i class="${i < step ? 'on' : i === step ? 'now' : ''}"></i>`).join(''); };
const score = () => { const s = Object.fromEntries(ORDER.map(k => [k, 0])); picks.forEach((p, i) => { const w = seq[i].doors[p][1]; for (const k in w) s[k] += w[k]; }); return ORDER.slice().sort((a, b) => s[b] - s[a] || ORDER.indexOf(a) - ORDER.indexOf(b)).map(k => [k, s[k]]); };
function intro(){
  step = -1; picks = []; seq = [FIRST]; drawDots();
  app.innerHTML = `<div class="stage"><div class="pic"><img src="img/arch.png" alt="A stone arch with a red keystone"></div>
  <h1>Every brand hits a crossroads.</h1>
  <p class="lead">Most brands ask for content when they need clarity, or a rebrand when they need a launch. Three questions, and you’ll know which road is yours. Every door says where it leads.</p>
  <div class="row"><button class="btn" id="go">Take the first door</button></div></div>`;
  document.getElementById('go').addEventListener('click', () => ask(0));
}
function ask(i){
  step = i; drawDots();
  const q = seq[i];
  app.innerHTML = `<div class="stage"><div class="pic"><img src="${q.img}" alt=""></div>
  <h1>${esc(q.q)}</h1>
  <div class="doors">${q.doors.map((d, j) => `<button class="door" data-j="${j}"><span>${esc(d[0])}</span><small>points to ${esc(d[3] || lead(d[1]))}</small></button>`).join('')}</div>
  <button class="back" id="back">${i ? 'Go back a door' : 'Start over'}</button></div>`;
  app.querySelectorAll('.door').forEach(b => b.addEventListener('click', () => {
    const j = +b.dataset.j; b.classList.add('open'); picks[i] = j; picks.length = i + 1;
    if (i === 0) seq = [FIRST, ...PATHS[FIRST.doors[j][2]]];
    setTimeout(() => i + 1 < seq.length ? ask(i + 1) : result(), 280);
  }));
  document.getElementById('back').addEventListener('click', () => i ? ask(i - 1) : intro());
  app.querySelector('.door').focus({preventScroll:true});
}
function result(){
  step = TOTAL; drawDots();
  const r = score(), top = OUT[r[0][0]], next = r[1][1] > 0 && r[1][1] >= r[0][1] - 1 ? OUT[r[1][0]] : null;
  app.innerHTML = `<div class="stage"><div class="pic"><img src="${top.img}" alt=""></div>
  <h1>${esc(top.title)}</h1>
  <div class="card"><p>${esc(top.why)}</p><ul class="gets">${top.gets.map(g => `<li>${esc(g)}</li>`).join('')}</ul>
    <div class="start"><span>Start with</span><b>${esc(top.start)}</b><span class="tag">${esc(top.tag)}</span></div></div>
  ${next ? `<p class="also">Close behind: ${esc(next.short)}. Worth raising on the call.</p>` : ''}
  <div class="row"><a class="btn" href="../index.html#book">Book a 20-minute call</a><button class="btn ghost" id="again">Go back to the crossroads</button></div></div>`;
  document.getElementById('again').addEventListener('click', intro);
}
intro();
}
</script>
</body>
</html>
